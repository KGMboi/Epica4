name: Java CI

on:
  push:
    branches:
      - main
      - developer
      - registrar
      - consultasBranch
      - QA
  pull_request:
    branches:
      - main
      - developer
      - registrar
      - consultasBranch
      - QA

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify
